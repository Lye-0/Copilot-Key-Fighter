name: Build and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test tests/CopilotKeyFighter.Tests/CopilotKeyFighter.Tests.csproj -c Release --logger trx
      - name: Package
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME -replace '^v','' } else { '0.1.0' }
          ./scripts/package.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: CopilotKeyFighter-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CopilotKeyFighter-win-x64
          path: artifacts
      - name: Create draft prerelease with corresponding source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES: |
            ### Windowsでの実行について

            本アプリはコード署名を行っていないため、初回起動時にWindows Defender SmartScreenの警告が表示される場合があります。

            その場合は、配布元が正しいことを確認したうえで、「詳細情報」→「実行」を選択してください。
        run: |
          git archive --format=zip --output=artifacts/CopilotKeyFighter-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          $files = @(Get-ChildItem artifacts -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @files --verify-tag --draft --prerelease --generate-notes --notes $env:RELEASE_NOTES
          if ($LASTEXITCODE -ne 0) { throw 'Draft release failed' }
